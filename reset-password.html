<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password - Water Quality Monitoring</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }

      .glass {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
    </style>
  </head>

  <body class="min-h-screen bg-slate-950 overflow-hidden">
    <!-- Background -->
    <div class="fixed inset-0">
      <div
        class="absolute inset-0 bg-gradient-to-br from-cyan-500/20 via-blue-600/10 to-violet-600/20"
      ></div>

      <div
        class="absolute top-0 left-0 w-96 h-96 bg-cyan-500/20 blur-3xl rounded-full"
      ></div>

      <div
        class="absolute bottom-0 right-0 w-96 h-96 bg-indigo-600/20 blur-3xl rounded-full"
      ></div>

      <div
        class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.04)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.04)_1px,transparent_1px)] bg-[size:40px_40px]"
      ></div>
    </div>

    <!-- Card -->
    <div
      class="relative z-10 min-h-screen flex items-center justify-center p-6"
    >
      <div
        class="glass w-full max-w-md bg-white/5 border border-white/10 rounded-3xl shadow-2xl overflow-hidden"
      >
        <div
          class="h-1 bg-gradient-to-r from-cyan-400 via-blue-500 to-violet-500"
        ></div>

        <div class="p-8">
          <!-- Badge -->
          <div
            class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-cyan-500/10 border border-cyan-400/20 text-cyan-400 text-xs font-semibold uppercase tracking-wider"
          >
            <i data-lucide="droplets" class="w-4 h-4"></i>

            Water Quality Monitoring
          </div>

          <!-- Heading -->
          <div class="mt-6">
            <h1 class="text-3xl font-bold text-white">Reset Password</h1>

            <p class="mt-2 text-slate-400 text-sm">
              Masukkan password baru untuk akun Anda.
            </p>
          </div>

          <!-- Alert -->
          <div
            id="alertBox"
            class="hidden mt-6 rounded-xl border px-4 py-3 text-sm"
          ></div>

          <!-- Form -->
          <form id="resetForm" class="mt-6 space-y-5">
            <!-- Password Baru -->
            <div>
              <label class="block text-sm text-slate-300 mb-2">
                Password Baru
              </label>

              <div class="relative">
                <i
                  data-lucide="lock"
                  class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"
                ></i>

                <input
                  id="newPassword"
                  type="password"
                  placeholder="Masukkan password baru"
                  class="w-full pl-12 pr-12 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition"
                />

                <button
                  type="button"
                  id="toggleNewPassword"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-cyan-400"
                >
                  <i id="newPasswordIcon" data-lucide="eye" class="w-5 h-5"></i>
                </button>
              </div>

              <p
                id="newPassword-err"
                class="hidden mt-2 text-sm text-red-400"
              ></p>
            </div>

            <!-- Konfirmasi Password -->
            <div>
              <label class="block text-sm text-slate-300 mb-2">
                Konfirmasi Password
              </label>

              <div class="relative">
                <i
                  data-lucide="shield-check"
                  class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"
                ></i>

                <input
                  id="confirmPassword"
                  type="password"
                  placeholder="Ulangi password baru"
                  class="w-full pl-12 pr-12 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition"
                />

                <button
                  type="button"
                  id="toggleConfirmPassword"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-cyan-400"
                >
                  <i
                    id="confirmPasswordIcon"
                    data-lucide="eye"
                    class="w-5 h-5"
                  ></i>
                </button>
              </div>

              <p
                id="confirmPassword-err"
                class="hidden mt-2 text-sm text-red-400"
              ></p>
            </div>

            <!-- Submit -->
            <button
              id="resetBtn"
              type="submit"
              class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-semibold shadow-lg shadow-cyan-500/20 hover:scale-[1.02] active:scale-[0.98] transition flex items-center justify-center gap-2"
            >
              <i data-lucide="save" class="w-5 h-5"></i>

              <span id="btnText"> Simpan Password </span>
            </button>
          </form>

          <!-- Back -->
          <div class="mt-6 text-center">
            <a
              href="index.html"
              class="inline-flex items-center gap-2 text-cyan-400 hover:text-cyan-300 text-sm"
            >
              <i data-lucide="arrow-left" class="w-4 h-4"></i>

              Kembali ke Login
            </a>
          </div>

          <!-- Footer -->
          <div
            class="mt-8 pt-6 border-t border-white/10 text-center text-xs text-slate-500"
          >
            © 2026 Rizky Project
          </div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="JS/reset-password.js"></script>
  </body>
</html>
