<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Water Quality Monitoring</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      body {
        font-family: "Inter", sans-serif;
      }

      .glass {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
    </style>
  </head>

  <body class="bg-slate-950 text-white min-h-screen overflow-x-hidden">
    <!-- Background -->
    <div class="fixed inset-0 -z-10">
      <div
        class="absolute inset-0 bg-gradient-to-br from-cyan-500/10 via-blue-500/5 to-violet-500/10"
      ></div>

      <div
        class="absolute top-0 left-0 w-96 h-96 bg-cyan-500/20 blur-3xl rounded-full"
      ></div>

      <div
        class="absolute bottom-0 right-0 w-96 h-96 bg-indigo-500/20 blur-3xl rounded-full"
      ></div>

      <div
        class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.04)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.04)_1px,transparent_1px)] bg-[size:40px_40px]"
      ></div>
    </div>

    <div class="flex min-h-screen">
      <!-- SIDEBAR -->
      <aside
        class="hidden lg:flex lg:flex-col w-72 border-r border-white/10 bg-white/5 glass p-6"
      >
        <!-- Logo -->
        <div class="flex items-center gap-3 mb-10">
          <!-- <div
            class="w-12 h-12 rounded-xl bg-cyan-500/20 flex items-center justify-center"
          >
            <i data-lucide="droplets" class="w-6 h-6 text-cyan-400"></i>
          </div> -->
          <!-- <div>
            <h2 class="font-bold text-lg">WQM</h2>
            <p class="text-xs text-slate-400">Monitoring System</p>
          </div> -->
          <div class="w-35 h35 flex items-center justify-center">
            <img
              src="assets/logo.png"
              alt="Logo WQM"
              class="w-35 h-35 object-contain"
            />
          </div>
        </div>

        <!-- Menu -->
        <nav class="space-y-2">
          <a
            href="dashboard.html"
            class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition"
          >
            <i data-lucide="layout-dashboard"></i>
            Dashboard
          </a>

          <a
            href="data-sensor.html"
            class="flex items-center gap-3 px-4 py-3 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400"
          >
            <i data-lucide="database"></i>
            Data Sensor
          </a>

          <a
            href="settings.html"
            class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition"
          >
            <i data-lucide="settings"></i>
            Settings
          </a>
        </nav>
      </aside>

      <!-- CONTENT -->
      <main class="flex-1 p-5 lg:p-8 pb-24 lg:pb-8">
        <!-- TOPBAR -->
        <header
          class="glass bg-white/5 border border-white/10 rounded-2xl p-5 flex flex-col md:flex-row md:items-center md:justify-between gap-4"
        >
          <div class="flex items-center gap-4">
            <div
              class="w-12 h-12 rounded-xl bg-cyan-500/20 flex items-center justify-center flex-shrink-0"
            >
              <i data-lucide="droplets" class="w-6 h-6 text-cyan-400"></i>
            </div>

            <div>
              <h1 class="text-2xl lg:text2xl font-bold">
                Water Quality Monitoring
              </h1>

              <p id="welcome" class="text-slate-400 mt-1">Selamat Datang</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span>ESP32: </span>
            <div
              id="esp32Status"
              class="flex items-center gap-2 px-4 py-2 rounded-full bg-slate-500/10 border border-slate-500/20 text-slate-400 text-sm"
            >
              <span class="h-2 w-2 rounded-full bg-slate-400"></span>
              Unknown
            </div>

            <span>MQTT: </span>
            <div
              id="mqttStatus"
              class="flex items-center gap-2 px-4 py-2 rounded-full bg-red-500/10 border border-red-500/20 text-red-400 text-sm"
            >
              <span
                id="mqttIndicator"
                class="w-2 h-2 rounded-full bg-red-400"
              ></span>

              <span id="mqttText">Disconnected</span>
            </div>

            <button
              id="logoutBtn"
              class="flex items-center gap-2 px-4 py-2 rounded-xl bg-red-500 hover:bg-red-600 transition"
            >
              <i data-lucide="log-out" class="w-4 h-4"></i>

              Logout
            </button>
          </div>
        </header>

        <!-- ============================================================== -->

        <!-- TABLE CARD -->
        <div
          class="mt-6 glass bg-white/5 border border-white/10 rounded-3xl overflow-hidden"
        >
          <!-- Toolbar -->
          <div
            class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 p-5 border-b border-white/10"
          >
            <div>
              <h1 class="font-semibold text-2xl">Riwayat Data Sensor</h1>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
              <div
                class="flex flex-col lg:flex-row lg:items-end gap-3 w-full lg:w-auto"
              >
                <!-- Tanggal Awal -->
                <div class="flex flex-col">
                  <label class="text-xs text-slate-400 mb-1">
                    Dari Tanggal
                  </label>

                  <input
                    type="date"
                    id="startDate"
                    class="px-4 py-2.5 rounded-xl bg-slate-900/60 border border-white/10 focus:border-cyan-500 focus:outline-none text-white"
                  />
                </div>

                <!-- Tanggal Akhir -->
                <div class="flex flex-col">
                  <label class="text-xs text-slate-400 mb-1">
                    Sampai Tanggal
                  </label>

                  <input
                    type="date"
                    id="endDate"
                    class="px-4 py-2.5 rounded-xl bg-slate-900/60 border border-white/10 focus:border-cyan-500 focus:outline-none text-white"
                  />
                </div>

                <!-- Tombol Filter -->
                <button
                  onclick="applyDateFilter()"
                  class="flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-600 transition"
                >
                  <i data-lucide="filter" class="w-4 h-4"></i>
                  Filter
                </button>

                <!-- Tombol Reset -->
                <button
                  onclick="resetFilter()"
                  class="flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 transition"
                >
                  <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                  Reset
                </button>

                <!-- Spreadsheet -->
                <a
                  href="https://docs.google.com/spreadsheets/d/1hXOeDx9mKg8bgExVMXz0BG0htuKYnhWgt7p_ujA6od4/edit?usp=sharing"
                  target="_blank"
                  class="flex items-center justify-center gap-2 px-4 py-2 rounded-xl bg-green-500 hover:bg-green-600 transition w-full sm:w-auto"
                >
                  <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                  Spreadsheet
                </a>
              </div>
            </div>
          </div>

          <!-- Table -->
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b border-white/10 text-slate-400">
                  <th class="text-left px-4 py-3">No.</th>
                  <th class="text-left px-4 py-3">Device</th>

                  <th class="text-center px-4 py-3">pH Avg</th>
                  <th class="text-center px-4 py-3">DO Avg.</th>
                  <th class="text-center px-4 py-3">Temp Avg.</th>

                  <th class="text-center px-4 py-3">Sample</th>

                  <th class="text-center px-4 py-3">Timestamp</th>
                </tr>
              </thead>

              <tbody id="sensorTableBody">
                <tr>
                  <td colspan="7" class="text-center py-10 text-slate-400">
                    Loading...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div
          class="flex justify-between items-center p-4 text-sm text-slate-300"
        >
          <button
            onclick="prevPage()"
            class="px-3 py-1 rounded bg-white/10 hover:bg-white/20"
          >
            Prev
          </button>

          <span id="pageInfo"></span>

          <button
            onclick="nextPage()"
            class="px-3 py-1 rounded bg-white/10 hover:bg-white/20"
          >
            Next
          </button>
        </div>
        <!-- ============================================================== -->
        <!-- FOOTER -->
        <footer class="text-center text-slate-500 text-sm mt-10 pb-4">
          © 2026 Rizky Project | Water Quality Monitoring System
        </footer>
      </main>
    </div>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav
      class="lg:hidden fixed bottom-0 left-0 right-0 z-50 border-t border-white/10 bg-slate-950/95 backdrop-blur-md"
    >
      <div class="grid grid-cols-3">
        <a
          href="dashboard.html"
          class="flex flex-col items-center justify-center py-3 text-slate-400 hover:text-white transition"
        >
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span class="text-xs mt-1">Dashboard</span>
        </a>

        <a
          href="data-sensor.html"
          class="flex flex-col items-center justify-center py-3 text-cyan-400"
        >
          <i data-lucide="database" class="w-5 h-5"></i>
          <span class="text-xs mt-1">Data</span>
        </a>
        <a
          href="settings.html"
          class="flex flex-col items-center justify-center py-3 text-slate-400 hover:text-white transition"
        >
          <i data-lucide="settings" class="w-5 h-5"></i>
          <span class="text-xs mt-1">Settings</span>
        </a>
      </div>
    </nav>

    <!-- MQTT -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <!-- Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- MQTT Config -->
    <script src="JS/layout.js"></script>

    <!-- Data Sensor -->
    <script src="JS/data-sensor.js"></script>
  </body>
</html>
