<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Water Quality Monitoring</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: "Inter", sans-serif;
    }

    .glass {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
  </style>
</head>

<body class="bg-slate-950 text-white min-h-screen overflow-x-hidden">
  <!-- Background -->
  <div class="fixed inset-0 -z-10">
    <div class="absolute inset-0 bg-gradient-to-br from-cyan-500/10 via-blue-500/5 to-violet-500/10"></div>

    <div class="absolute top-0 left-0 w-96 h-96 bg-cyan-500/20 blur-3xl rounded-full"></div>

    <div class="absolute bottom-0 right-0 w-96 h-96 bg-indigo-500/20 blur-3xl rounded-full"></div>

    <div
      class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.04)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.04)_1px,transparent_1px)] bg-[size:40px_40px]">
    </div>
  </div>

  <div class="flex min-h-screen">
    <!-- SIDEBAR -->
    <aside class="hidden lg:flex lg:flex-col w-72 border-r border-white/10 bg-white/5 glass p-6">
      <!-- Logo -->
      <div class="flex items-center gap-3 mb-10">
        <!-- <div
            class="w-12 h-12 rounded-xl bg-cyan-500/20 flex items-center justify-center"
          >
            <i data-lucide="droplets" class="w-6 h-6 text-cyan-400"></i>
          </div> -->
        <!-- <div>
            <h2 class="font-bold text-lg">WQM</h2>
            <p class="text-xs text-slate-400">Monitoring System</p>
          </div> -->
        <div class="w-35 h35 flex items-center justify-center">
          <img src="assets/logo.png" alt="Logo WQM" class="w-35 h-35 object-contain" />
        </div>
      </div>

      <!-- Menu -->
      <nav class="space-y-2">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition">
          <i data-lucide="layout-dashboard"></i>
          Dashboard
        </a>

        <a href="data-sensor.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition">
          <i data-lucide="database"></i>
          Data Sensor
        </a>

        <a href="settings.html"
          class="flex items-center gap-3 px-4 py-3 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400">
          <i data-lucide="settings"></i>
          Settings
        </a>
      </nav>
    </aside>

    <!-- CONTENT -->
    <main class="flex-1 p-5 lg:p-8 pb-24 lg:pb-8">
      <!-- TOPBAR -->
      <header
        class="glass bg-white/5 border border-white/10 rounded-2xl p-5 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-cyan-500/20 flex items-center justify-center flex-shrink-0">
            <i data-lucide="droplets" class="w-6 h-6 text-cyan-400"></i>
          </div>

          <div>
            <h1 class="text-2xl lg:text2xl font-bold">
              Water Quality Monitoring
            </h1>

            <p id="welcome" class="text-slate-400 mt-1">Selamat Datang</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <span>ESP32: </span>
          <div id="esp32Status"
            class="flex items-center gap-2 px-4 py-2 rounded-full bg-slate-500/10 border border-slate-500/20 text-slate-400 text-sm">
            <span class="h-2 w-2 rounded-full bg-slate-400"></span>
            Unknown
          </div>

          <span>MQTT: </span>
          <div id="mqttStatus"
            class="flex items-center gap-2 px-4 py-2 rounded-full bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
            <span id="mqttIndicator" class="w-2 h-2 rounded-full bg-red-400"></span>

            <span id="mqttText">Disconnected</span>
          </div>

          <button id="logoutBtn"
            class="flex items-center gap-2 px-4 py-2 rounded-xl bg-red-500 hover:bg-red-600 transition">
            <i data-lucide="log-out" class="w-4 h-4"></i>

            Logout
          </button>
        </div>
      </header>

      <!-- ============================================================== -->

      <!-- CONTENTS -->

      <main class="flex-1 p-5 lg:p-8 pb-24 lg:pb-8">
        <!-- GRID SETTINGS -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- ================= MQTT CONFIG ================= -->
          <div class="glass bg-white/5 border border-white/10 rounded-2xl p-6">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
              <i data-lucide="wifi" class="w-5 h-5 text-cyan-400"></i>
              MQTT Configuration
            </h2>

            <div class="space-y-3">
              <div class="relative">
                <i data-lucide="server" class="absolute left-3 top-3.5 w-4 h-4 text-slate-400"></i>
                <input id="mqttBroker" class="w-full pl-10 p-3 rounded-lg bg-slate-900/50 border border-white/10"
                  placeholder="Broker" />
              </div>

              <div class="relative">
                <i data-lucide="hash" class="absolute left-3 top-3.5 w-4 h-4 text-slate-400"></i>
                <input id="mqttPort" class="w-full pl-10 p-3 rounded-lg bg-slate-900/50 border border-white/10"
                  placeholder="Port" />
              </div>

              <div class="relative">
                <i data-lucide="tag" class="absolute left-3 top-3.5 w-4 h-4 text-slate-400"></i>
                <input id="mqttTopicSensor" class="w-full pl-10 p-3 rounded-lg bg-slate-900/50 border border-white/10"
                  placeholder="Topic Sensor" />
              </div>

              <div class="relative">
                <i data-lucide="tags" class="absolute left-3 top-3.5 w-4 h-4 text-slate-400"></i>
                <input id="mqttTopicStatus" class="w-full pl-10 p-3 rounded-lg bg-slate-900/50 border border-white/10"
                  placeholder="Topic Status" />
              </div>

              <button onclick="saveMQTT()"
                class="w-full flex items-center justify-center gap-2 bg-cyan-500 hover:bg-cyan-600 py-2 rounded-lg">
                <i data-lucide="save" class="w-4 h-4"></i>
                Save MQTT
              </button>
            </div>
          </div>

          <!-- ================= PASSWORD ================= -->
          <div class="glass bg-white/5 border border-white/10 rounded-2xl p-6">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
              <i data-lucide="lock" class="w-5 h-5 text-red-400"></i>
              Change Password
            </h2>

            <div class="space-y-3">

              <!-- Old Password -->
              <div class="relative">
                <i data-lucide="key" class="absolute left-3 top-3.5 w-4 h-4 text-slate-400"></i>
                <input id="oldPassword" type="password"
                  class="w-full pl-10 p-3 rounded-lg bg-slate-900/50 border border-white/10"
                  placeholder="Old Password" />
              </div>

              <!-- New Password -->
              <div class="relative">
                <i data-lucide="shield" class="absolute left-3 top-3.5 w-4 h-4 text-slate-400"></i>
                <input id="newPassword" type="password"
                  class="w-full pl-10 p-3 rounded-lg bg-slate-900/50 border border-white/10"
                  placeholder="New Password" />
              </div>

              <!-- Confirm New Password -->
              <div class="relative">
                <i data-lucide="check-circle" class="absolute left-3 top-3.5 w-4 h-4 text-slate-400"></i>
                <input id="confirmPassword" type="password"
                  class="w-full pl-10 p-3 rounded-lg bg-slate-900/50 border border-white/10"
                  placeholder="Confirm New Password" />
              </div>

              <!-- Button -->
              <button onclick="changePassword()"
                class="w-full flex items-center justify-center gap-2 bg-red-500 hover:bg-red-600 py-2 rounded-lg">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                Change Password
              </button>

            </div>
          </div>
          <!-- ================= TELEGRAM ================= -->
          <div class="glass bg-white/5 border border-white/10 rounded-2xl p-6">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
              <i data-lucide="send" class="w-5 h-5 text-green-400"></i>
              Telegram Chat ID
            </h2>

            <div class="relative">
              <i data-lucide="at-sign" class="absolute left-3 top-3.5 w-4 h-4 text-slate-400"></i>
              <input id="chatId" class="w-full pl-10 p-3 rounded-lg bg-slate-900/50 border border-white/10"
                placeholder="Chat ID" />
            </div>

            <button onclick="saveChatID()"
              class="w-full mt-3 flex items-center justify-center gap-2 bg-green-500 hover:bg-green-600 py-2 rounded-lg">
              <i data-lucide="message-circle" class="w-4 h-4"></i>
              Save Chat ID
            </button>
          </div>

          <!-- ================= SENSOR THRESHOLD ================= -->
          <div class="glass bg-white/5 border border-white/10 rounded-2xl p-6">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
              <i data-lucide="activity" class="w-5 h-5 text-indigo-400"></i>
              Sensor Threshold
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">

              <!-- pH Min -->
              <div class="flex items-center gap-3">
                <label class="w-20 text-xs text-slate-400">pH Min</label>
                <input id="phMin"
                  class="w-full max-w-[160px] p-2 text-sm rounded-lg bg-slate-900/50 border border-white/10"
                  placeholder="min">
              </div>

              <!-- pH Max -->
              <div class="flex items-center gap-3">
                <label class="w-20 text-xs text-slate-400">pH Max</label>
                <input id="phMax"
                  class="w-full max-w-[160px] p-2 text-sm rounded-lg bg-slate-900/50 border border-white/10"
                  placeholder="max">
              </div>

              <!-- DO Min -->
              <div class="flex items-center gap-3">
                <label class="w-20 text-xs text-slate-400">DO Min</label>
                <input id="doMin"
                  class="w-full max-w-[160px] p-2 text-sm rounded-lg bg-slate-900/50 border border-white/10"
                  placeholder="min">
              </div>

              <!-- DO Max -->
              <div class="flex items-center gap-3">
                <label class="w-20 text-xs text-slate-400">DO Max</label>
                <input id="doMax"
                  class="w-full max-w-[160px] p-2 text-sm rounded-lg bg-slate-900/50 border border-white/10"
                  placeholder="max">
              </div>

              <!-- Temp Min -->
              <div class="flex items-center gap-3">
                <label class="w-20 text-xs text-slate-400">Temp Min</label>
                <input id="tempMin"
                  class="w-full max-w-[160px] p-2 text-sm rounded-lg bg-slate-900/50 border border-white/10"
                  placeholder="min">
              </div>

              <!-- Temp Max -->
              <div class="flex items-center gap-3">
                <label class="w-20 text-xs text-slate-400">Temp Max</label>
                <input id="tempMax"
                  class="w-full max-w-[160px] p-2 text-sm rounded-lg bg-slate-900/50 border border-white/10"
                  placeholder="max">
              </div>

            </div>

            <button onclick="saveThreshold()"
              class="w-full mt-4 flex items-center justify-center gap-2 bg-indigo-500 hover:bg-indigo-600 py-2 rounded-lg text-sm">
              <i data-lucide="save" class="w-4 h-4"></i>
              Save Threshold
            </button>
          </div>
      </main>

      <!-- ============================================================== -->
      <!-- FOOTER -->
      <footer class="text-center text-slate-500 text-sm mt-10 pb-4">
        © 2026 Rizky Project | Water Quality Monitoring System
      </footer>

  </div>

  <!-- MOBILE BOTTOM NAVIGATION -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 z-50 border-t border-white/10 bg-slate-950/95 backdrop-blur-md">
    <div class="grid grid-cols-3">
      <a href="dashboard.html"
        class="flex flex-col items-center justify-center py-3 text-slate-400 hover:text-white transition">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span class="text-xs mt-1">Dashboard</span>
      </a>

      <a href="data-sensor.html"
        class="flex flex-col items-center justify-center py-3 text-slate-400 hover:text-white transition">
        <i data-lucide="database" class="w-5 h-5"></i>
        <span class="text-xs mt-1">Data</span>
      </a>
      <a href="settings.html" class="flex flex-col items-center justify-center py-3 text-cyan-400">
        <i data-lucide="settings" class="w-5 h-5"></i>
        <span class="text-xs mt-1">Settings</span>
      </a>
    </div>
  </nav>

  <!-- MQTT -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- MQTT Config -->
  <script src="JS/layout.js"></script>

  <!-- Settings JS -->
  <script src="JS/settings.js"></script>
</body>

</html>
