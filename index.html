<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water Quality Monitoring</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }

      .glass {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
    </style>
  </head>

  <body class="min-h-screen bg-slate-950 overflow-hidden">
    <!-- Background -->
    <div class="fixed inset-0">
      <div
        class="absolute inset-0 bg-gradient-to-br from-sky-500/20 via-blue-600/10 to-purple-600/20"
      ></div>

      <div
        class="absolute top-0 left-0 w-96 h-96 bg-cyan-500/20 blur-3xl rounded-full"
      ></div>

      <div
        class="absolute bottom-0 right-0 w-96 h-96 bg-indigo-600/20 blur-3xl rounded-full"
      ></div>

      <div
        class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.04)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.04)_1px,transparent_1px)] bg-[size:40px_40px]"
      ></div>
    </div>

    <!-- Login Card -->
    <div
      class="relative z-10 min-h-screen flex items-center justify-center p-6"
    >
      <div
        class="glass w-full max-w-md bg-white/5 border border-white/10 rounded-3xl shadow-2xl overflow-hidden"
      >
        <!-- Top Accent -->
        <div
          class="h-1 bg-gradient-to-r from-cyan-400 via-blue-500 to-violet-500"
        ></div>

        <div class="p-8">
          <!-- Badge -->
          <div
            class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-cyan-500/10 border border-cyan-400/20 text-cyan-400 text-xs font-semibold uppercase tracking-wider"
          >
            <i data-lucide="droplets" class="w-4 h-4"></i>
            Water Quality Monitoring
          </div>

          <!-- Heading -->
          <div class="mt-6">
            <h2 class="text-3xl font-bold text-white">Login</h2>

            <p class="mt-2 text-slate-100 text-sm">
              Silakan login untuk mengakses Dashboard IoT
            </p>
          </div>

          <!-- Username -->
          <div class="mt-8">
            <label class="block text-sm text-slate-300 mb-2"> Username </label>

            <div class="relative">
              <i
                data-lucide="user"
                class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"
              >
              </i>

              <input
                id="username"
                type="text"
                placeholder="Masukkan username"
                autocomplete="username"
                class="w-full pl-12 pr-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition"
              />
            </div>

            <p id="username-err" class="hidden mt-2 text-sm text-red-400">
              Username tidak boleh kosong
            </p>
          </div>

          <!-- Password -->
          <div class="mt-5">
            <label class="block text-sm text-slate-300 mb-2"> Password </label>

            <div class="relative">
              <i
                data-lucide="lock"
                class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"
              >
              </i>

              <input
                id="password"
                type="password"
                placeholder="Masukkan password"
                class="w-full pl-12 pr-12 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition"
              />

              <button
                id="togglePw"
                type="button"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-cyan-400 transition"
              >
                <i id="passwordIcon" data-lucide="eye" class="w-5 h-5"> </i>
              </button>
            </div>

            <p id="password-err" class="hidden mt-2 text-sm text-red-400">
              Password tidak boleh kosong
            </p>
          </div>

          <!-- Remember -->
          <div class="flex items-center justify-between mt-5">
            <label class="flex items-center gap-2 text-sm text-slate-400">
              <input id="remember" type="checkbox" class="accent-cyan-500" />

              Ingat Saya
            </label>

            <a
              href="forgot-password.html"
              class="text-sm text-cyan-400 hover:text-cyan-300"
            >
              Lupa Password?
            </a>
          </div>

          <!-- Login Button -->
          <button
            id="loginBtn"
            type="button"
            class="mt-8 w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-semibold flex items-center justify-center gap-2"
          >
            <i data-lucide="log-in" class="w-5 h-5"></i>
            <span>Login</span>
          </button>

          <!-- Alert -->
          <div
            id="alertBox"
            class="hidden mt-5 rounded-xl border px-4 py-3 text-sm"
          ></div>

          <!-- Footer -->
          <div
            class="mt-8 pt-6 border-t border-white/10 text-center text-xs text-slate-500"
          >
            © 2026 Rizky Project
          </div>
        </div>
      </div>
    </div>
    <script>
      lucide.createIcons();
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="JS/login.js"></script>
  </body>
</html>
